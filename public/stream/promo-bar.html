<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>AMRP — промокод START</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
<style>
html, body { margin: 0; background: transparent; overflow: hidden; width: 100vw; height: 100vh; }
.wrap { position: absolute; left: 50%; bottom: 6vh; transform: translateX(-50%); display: flex; align-items: center; height: 120px; }
.logo { width: 120px; height: 120px; position: relative; z-index: 3; transform: scale(0) rotate(-200deg); filter: drop-shadow(0 0 18px rgba(232,176,74,.75)); }
.logo { perspective: 600px; }
.spin { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; }
.logo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; backface-visibility: hidden; }
.logo img.b { transform: rotateY(180deg); filter: sepia(1) saturate(4) hue-rotate(-12deg) brightness(.85); }
.bar { position: relative; height: 84px; margin-left: -34px; padding: 0 44px 0 58px; display: flex; align-items: center; gap: 28px; clip-path: polygon(0 0, 0 0, 0 100%, 0 100%); background: linear-gradient(180deg, rgba(26,22,18,.96), rgba(10,9,12,.96)); border-top: 2px solid #e8b04a; border-bottom: 2px solid #8a5d1c; box-shadow: 0 10px 40px rgba(0,0,0,.6); overflow: hidden; }
.bar::after { content: ""; position: absolute; top: 0; bottom: 0; right: 0; width: 6px; background: #e8b04a; }
.bar::before { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 140% at 30% 50%, rgba(232,176,74,.22), transparent 70%); }
.txt { position: relative; display: flex; flex-direction: column; font-family: "Montserrat", sans-serif; color: #f1e9dc; white-space: nowrap; }
.txt small { font-size: 15px; font-weight: 600; letter-spacing: 3px; color: rgba(241,233,220,.7); text-transform: uppercase; }
.txt span { font-size: 22px; font-weight: 800; }
.txt span em { font-style: normal; color: #e8b04a; }
.code { position: relative; font-family: "Oswald", sans-serif; font-weight: 700; font-size: 62px; line-height: 1; letter-spacing: 3px; padding: 4px 22px 8px; border: 2px dashed rgba(232,176,74,.7); border-radius: 10px; background: linear-gradient(180deg, #fff1c4, #e8b04a 55%, #b5761f); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 0 #4a2a06) drop-shadow(0 0 14px rgba(232,176,74,.55)); overflow: hidden; }
.shine { position: absolute; top: 0; bottom: 0; left: -40%; width: 30%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent); transform: skewX(-20deg); pointer-events: none; }
.spark { position: absolute; width: 14px; height: 14px; background: #fff3cf; clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%); opacity: 0; z-index: 4; }

.go .logo { animation: lIn .7s cubic-bezier(.2,1.4,.4,1) forwards; }
.go .spin { animation: lSpin 3s 1.2s ease-in-out infinite; }
.go .bar { animation: bIn .6s .35s cubic-bezier(.7,0,.2,1) forwards; }
.go .shine { animation: sh 2.2s 1.1s ease-in-out infinite; }
.go .spark { animation: sp 1.6s ease-out infinite; }
.out .logo { animation: lOut .5s .35s ease-in forwards; }
.out .bar { animation: bOut .5s cubic-bezier(.7,0,.2,1) forwards; }

@keyframes lIn { to { transform: scale(1) rotate(0); } }
@keyframes lSpin { 0%, 55% { transform: rotateY(0); } 85%, 100% { transform: rotateY(360deg); } }
@keyframes lOut { from { transform: scale(1); } to { transform: scale(0) rotate(200deg); } }
@keyframes bIn { from { clip-path: polygon(0 0, 0 0, 0 100%, 0 100%); } to { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); } }
@keyframes bOut { from { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); } to { clip-path: polygon(0 0, 0 0, 0 100%, 0 100%); } }
@keyframes sh { 0% { left: -40%; } 45%, 100% { left: 130%; } }
@keyframes sp { 0% { opacity: 0; transform: scale(.2) rotate(0); } 30% { opacity: 1; transform: scale(1) rotate(45deg); } 100% { opacity: 0; transform: scale(.3) rotate(90deg); } }
</style>
</head>
<body>
<div class="wrap" id="w">
    <div class="logo"><div class="spin"><img class="f" src="logo.png" alt="AMRP"><img class="b" src="logo.png" alt=""></div></div>
    <div class="bar">
        <div class="txt"><small>Играй на AMRP</small><span>Введи в игре <em>/promo</em> и забери бонус</span></div>
        <div class="code" id="code">START<i class="shine"></i></div>
    </div>
</div>
<script>
var q = new URLSearchParams(location.search);
var every = Math.max(10, Number(q.get('every')) || 300);
var show = Math.max(5, Number(q.get('show')) || 15);
if (q.get('code')) document.getElementById('code').firstChild.nodeValue = q.get('code').toUpperCase();
var w = document.getElementById('w'), bar = w.querySelector('.bar');
for (var i = 0; i < 7; i++) {
    var s = document.createElement('i'); s.className = 'spark';
    s.style.left = (52 + Math.random() * 44) + '%'; s.style.top = (Math.random() * 80) + '%';
    s.style.animationDelay = (Math.random() * 1.6) + 's';
    bar.appendChild(s);
}
function cycle() {
    w.className = 'wrap'; void w.offsetWidth; w.className = 'wrap go';
    setTimeout(function () { w.className = 'wrap out'; }, show * 1000);
}
cycle();
setInterval(cycle, every * 1000);
</script>
</body>
</html>
