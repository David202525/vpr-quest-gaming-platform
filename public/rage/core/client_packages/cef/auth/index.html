<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>AMRP — Вход</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="vignette"></div>
<div class="card">
    <div class="brand">
        <img class="brand-logo" src="logo.png" alt="AMRP">
        <div>
            <div class="brand-title">AMRP</div>
            <div class="brand-sub" id="social">Добро пожаловать</div>
        </div>
    </div>
    <div class="tabs">
        <button class="tab active" data-tab="login">Вход</button>
        <button class="tab" data-tab="register">Регистрация</button>
    </div>
    <label>Логин</label>
    <input id="login" maxlength="32" autocomplete="off" spellcheck="false">
    <label>Пароль</label>
    <input id="pass" type="password" maxlength="64">
    <div class="reg-only">
        <label>Повторите пароль</label>
        <input id="pass2" type="password" maxlength="64">
    </div>
    <div class="error" id="error"></div>
    <button class="go" id="go">Войти</button>
</div>
<div class="spawn" id="spawn">
    <div class="sp-h"><small>С возвращением,</small><b id="spName"></b><span>Где вы хотите появиться?</span></div>
    <div class="sp-list" id="spList"></div>
    <button class="go" id="spGo" disabled>Появиться</button>
</div>
<script src="app.js"></script>
</body>
</html>
