<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание персонажа</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="vignette"></div>

    <div class="brand">
        <div class="brand-mark">S</div>
        <div>
            <div class="brand-title">Новый персонаж</div>
            <div class="brand-sub">Создай свою историю</div>
        </div>
    </div>

    <div class="left-dock">
        <div class="card">
            <div class="card-label">Пол</div>
            <div class="gender-switch">
                <button class="g-btn active" data-gender="0"><span class="g-ico">♂</span>Мужчина</button>
                <button class="g-btn" data-gender="1"><span class="g-ico">♀</span>Женщина</button>
            </div>
        </div>
        <div class="card">
            <div class="card-label">Камера</div>
            <div class="cam-row">
                <button class="cam" data-zone="face">Лицо</button>
                <button class="cam active" data-zone="body">Тело</button>
                <button class="cam" data-zone="legs">Ноги</button>
            </div>
        </div>
        <div class="card">
            <div class="card-label">Поворот</div>
            <div class="rotate-row">
                <button class="rot" data-dir="-1">&#10226;</button>
                <button class="rot" data-dir="1">&#10227;</button>
            </div>
        </div>
        <button class="random" id="randomBtn">Случайная внешность</button>
    </div>

    <div class="panel">
        <nav class="nav">
            <button class="nav-btn active" data-section="heritage"><span>01</span>Наследие</button>
            <button class="nav-btn" data-section="face"><span>02</span>Лицо</button>
            <button class="nav-btn" data-section="hair"><span>03</span>Волосы</button>
            <button class="nav-btn" data-section="info"><span>04</span>Данные</button>
        </nav>

        <div class="scroll">
            <section class="section active" data-section="heritage">
                <h3>Родители</h3>
                <div id="heritageList"></div>
                <h3>Глаза</h3>
                <div id="eyeList"></div>
            </section>

            <section class="section" data-section="face">
                <h3>Черты лица</h3>
                <div id="featureList"></div>
                <h3>Детали</h3>
                <div id="overlayList"></div>
            </section>

            <section class="section" data-section="hair">
                <h3>Причёска</h3>
                <div id="hairList"></div>
                <h3>Брови и борода</h3>
                <div id="browList"></div>
            </section>

            <section class="section" data-section="info">
                <h3>Документы</h3>
                <div class="field"><input type="text" id="firstname" placeholder=" " maxlength="16"><label>Имя</label></div>
                <div class="field"><input type="text" id="lastname" placeholder=" " maxlength="16"><label>Фамилия</label></div>
                <p class="hint">Только буквы, от 2 до 16 символов. Имя потом изменить нельзя.</p>
                <div id="creatorError" class="error"></div>
            </section>
        </div>

        <div class="footer">
            <button class="ghost" id="prevBtn">Назад</button>
            <button class="finish" id="nextBtn">Далее</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
