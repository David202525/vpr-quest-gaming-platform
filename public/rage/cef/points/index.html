<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>points</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="box">
    <div class="hd">
        <i>📍</i>
        <div><b>Редактор меток</b><small id="cnt">—</small></div>
        <button class="x" id="close">✕</button>
    </div>
    <div class="bar">
        <input id="q" placeholder="Поиск: банда, мэрия, гараж, койка…" autocomplete="off">
        <label><input type="checkbox" id="near"> Только рядом (100 м)</label>
    </div>
    <div class="list" id="list"></div>
    <div class="tip">«Подогнать» — точная настройка стрелками прямо в игре · «Сюда» — перенести туда, где вы стоите · «ТП» — телепорт к метке</div>
</div>
<script src="app.js"></script>
</body>
</html>
