<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Объявление</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { width: 100vw; height: 100vh; overflow: hidden; background: transparent; pointer-events: none; }
        .ann { position: fixed; top: 90px; left: 50%; transform: translate(-50%, -30px); opacity: 0; min-width: 420px; max-width: 760px; padding: 18px 26px; background: rgba(14,10,24,0.92); border: 1px solid rgba(193,61,255,0.45); border-radius: 16px; box-shadow: 0 0 50px rgba(139,61,255,0.35); color: #fff; text-align: center; transition: .4s cubic-bezier(.2,.8,.2,1); }
        .ann.show { opacity: 1; transform: translate(-50%, 0); }
        .t { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #c13dff; font-weight: 800; margin-bottom: 8px; }
        .m { font-size: 18px; font-weight: 600; line-height: 1.4; }
        .a { font-size: 11px; color: #8c8ca0; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="ann" id="ann">
        <div class="t">Объявление администрации</div>
        <div class="m" id="msg"></div>
        <div class="a" id="author"></div>
    </div>
    <script>
        var hideT = null;
        window.announce = function (text, author) {
            document.getElementById('msg').textContent = text;
            document.getElementById('author').textContent = author ? '— ' + author : '';
            var el = document.getElementById('ann');
            el.classList.add('show');
            clearTimeout(hideT);
            hideT = setTimeout(function () { el.classList.remove('show'); }, 9000);
        };
    </script>
</body>
</html>
